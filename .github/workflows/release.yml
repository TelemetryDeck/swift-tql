name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    name: Tag and release the next version

    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The version is one integer. The tag is N.0.0 because SwiftPM needs three parts.
          latest=$(gh api "repos/$GITHUB_REPOSITORY/tags" --paginate --jq '.[].name' \
            | sed 's/^v//' | cut -d. -f1 | grep -E '^[0-9]+$' | sort -n | tail -1)
          next=$(( ${latest:-0} + 1 ))
          gh release create "$next.0.0" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Version $next" --generate-notes
