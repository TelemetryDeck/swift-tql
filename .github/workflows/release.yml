name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

# A new merge cancels a release that still waits, so quick merges give one release.
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    name: Tag and release the next version
    environment: release # has the wait timer

    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/tags" --paginate --jq '.[].name' \
            | grep -E '^[0-9]+\.[0-9]+(\.[0-9]+)?$' | sort -V | tail -1)
          IFS=. read -r major minor _ <<< "$latest"
          # A merged pull request with the label "major" starts a new major version.
          labels=$(gh api "repos/$GITHUB_REPOSITORY/compare/$latest...$GITHUB_SHA" --jq '.commits[].sha' \
            | while read -r sha; do
                gh api "repos/$GITHUB_REPOSITORY/commits/$sha/pulls" --jq '.[].labels[].name'
              done)
          if grep -qx major <<< "$labels"; then
            next="$((major + 1)).0.0"
          else
            next="$major.$((minor + 1)).0"
          fi
          gh release create "$next" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Version $next" --generate-notes
